<!DOCTYPE html>
<html>
<head>
<title>Skills</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:60px;
}

h1{
color:#38bdf8;
text-align:center;
margin-bottom:40px;
}



.skills-container{
display:grid;
grid-template-columns:repeat(4, 1fr);
gap:25px;
}



.skill-box{
background:#020617;
padding:25px;
text-align:center;
border-radius:12px;
border:1px solid #1e293b;
font-weight:bold;
transition:0.3s;
cursor:pointer;
}



.skill-box:hover{
transform:translateY(-6px);
border-color:#38bdf8;
color:#38bdf8;
box-shadow:0 0 12px #38bdf8;
}

</style>

</head>

<body>

<h1>Skills</h1>

<div class="skills-container">

<div class="skill-box">HTML & CSS</div>
<div class="skill-box">Java Programming</div>
<div class="skill-box">OOPS</div>
<div class="skill-box">Computational Problem Solving</div>
<div class="skill-box">MATLAB Programming</div>
<div class="skill-box">Discrete Mathematics</div>
<div class="skill-box">Linux</div>
<div class="skill-box">Raspberry Pi</div>

</div>

</body>
</html>
